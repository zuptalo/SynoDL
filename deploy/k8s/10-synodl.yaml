# synodl: the all-in-one SynoDL image (the built PWA at / plus the /v1 API and
# /healthz, all on one origin at :8080). Two modes (constitution v2.0.0):
#   - legacy/stateless: no SECRETS_KEY ⇒ the client authenticates to the NAS and
#     carries the sid; nothing is persisted (the mounted volume goes unused).
#   - stateful (spec 0003): a SECRETS_KEY secret ⇒ its own accounts + setup wizard,
#     backed by one encrypted SQLite database on the synodl-data volume, reaching
#     the NAS through a single stored connection.
# The SECRETS_KEY secret is optional here, so this manifest is safe to apply in
# either mode; create the secret (install.sh) to switch a running instance to
# stateful. Back up = the synodl-data volume PLUS the SECRETS_KEY secret.
#
# Single replica, Recreate strategy: the SQLite volume is single-writer.
#
# Keel auto-updates this Deployment: it polls ghcr.io/zuptalo/synodl:latest and,
# when the tag's digest changes (a new production release moves :latest), forces a
# rolling redeploy — so this cluster always tracks the newest stable release. Keel
# itself is already installed cluster-wide (shared with the Ring deployment); this
# folder does NOT reinstall it. To follow the rolling dev build instead, point the
# image tag below at :develop.
apiVersion: v1
kind: ConfigMap
metadata:
  name: synodl-config
  namespace: synodl
data:
  ENV: "production"
  PORT: "8080"
  # Browser origin allowlist for CORS. Must exactly match the public URL the PWA is
  # served from — same-origin in single-container mode, but the check is explicit.
  ALLOWED_ORIGINS: "https://${APP_HOST}"
  # OPTIONAL in stateful mode (the default when synodl-secrets/SECRETS_KEY exists):
  # the NAS connection is configured in the first-run wizard and stored in the DB,
  # so this is left empty and only used as a one-time wizard prefill. It is REQUIRED
  # only for legacy stateless mode (STATELESS=true), where it is the single NAS the
  # proxy forwards to, reachable from inside the cluster.
  SYNO_URL: "${SYNO_URL}"
  # Set to "true" ONLY if the NAS presents a self-signed / private-CA TLS cert
  # (common for a LAN NAS on its DSM :5001). Leave "false" for a real cert.
  SYNO_TLS_INSECURE: "${SYNO_TLS_INSECURE}"
  # Where the SQLite database lives on the mounted volume (spec 0003). The server
  # runs STATEFUL (setup wizard + SynoDL accounts) only when a SECRETS_KEY secret
  # is also present; without it, it stays on the legacy SYNO_URL path — so this is
  # safe to apply before you're ready to switch.
  DATA_DIR: "/data"
  # STATIC_DIR (=/app/web, single-container mode) is baked into the image; no need
  # to repeat it here.
---
apiVersion: v1
kind: Service
metadata:
  name: synodl
  namespace: synodl
spec:
  selector:
    app: synodl
  ports:
    - name: http # PWA + /v1 API + /healthz (also the IngressRoute + probe target)
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synodl
  namespace: synodl
  annotations:
    # Keel: watch the mutable :latest tag and force a redeploy on a new digest.
    keel.sh/policy: force
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 2m"
spec:
  replicas: 1
  strategy:
    # Recreate (stop-then-start), not RollingUpdate: the stateful mode keeps a
    # single-writer SQLite database on one ReadWriteOnce volume, so two pods must
    # never hold it at once. Brief downtime on deploy is fine for a home app.
    type: Recreate
  selector:
    matchLabels:
      app: synodl
  template:
    metadata:
      labels:
        app: synodl
    spec:
      # The image runs as uid/gid 1000; fsGroup makes the mounted SQLite volume
      # group-owned by 1000 so the non-root process can write the database.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: synodl
          image: ghcr.io/zuptalo/synodl:latest
          imagePullPolicy: Always
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef:
                name: synodl-config
          env:
            # SECRETS_KEY activates stateful mode and encrypts stored NAS creds +
            # the VAPID private key at rest. optional:true means an absent secret
            # leaves the server on the legacy path — so this manifest is safe to
            # apply before you create the secret; create it (install.sh) to switch.
            - name: SECRETS_KEY
              valueFrom:
                secretKeyRef:
                  name: synodl-secrets
                  key: SECRETS_KEY
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /data
          # /healthz returns 200 once the HTTP server is up. Liveness/readiness hit it.
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 500m
              memory: 192Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: synodl-data
---
# The single stateful volume (constitution v2.0.0): the SQLite database only.
# k3s's default local-path provisioner; 1Gi is ample (config + a few accounts +
# push subscriptions). Back this up together with SECRETS_KEY to restore.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: synodl-data
  namespace: synodl
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
