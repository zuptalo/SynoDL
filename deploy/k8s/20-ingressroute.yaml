# HTTP routing on k3s's built-in Traefik.
#
# TLS is terminated HERE, in-cluster, by the k3s Traefik's own ACME resolver
# (`letsencrypt`, configured on the traefik HelmChartConfig in kube-system). The
# edge proxy that fronts the cluster does NOT terminate for this host — it
# SNI-passthroughs :443 straight to the k3s node, which is what lets the ACME
# TLS-ALPN-01 challenge reach Traefik at all:
#
#   edge Traefik  ──TCP, tls.passthrough──►  k3s :443 (websecure) ─► synodl:8080
#        └─ HostSNI(`${APP_HOST}`)                └─ terminates + renews the cert
#
# Why passthrough rather than terminating at the edge: TLS-ALPN-01 negotiates the
# `acme-tls/1` protocol on :443, so the connection has to arrive at the Traefik
# that owns the cert with SNI intact. Terminating upstream would break renewal.
#
# Two routers, deliberately:
#
#   synodl-tls  the real one — websecure, with the cert resolver.
#   synodl      plain HTTP on `web`. Kept because it costs nothing and is the
#               fallback path for an edge that DOES terminate TLS and forwards
#               cleartext to :80 (the older setup, and what a different operator
#               may still be running). It also keeps this app reachable while a
#               cert is still being issued, instead of failing closed.
#
# NOTE: the cert cannot be issued until :443 for ${APP_HOST} actually reaches this
# cluster. If the edge still routes this host somewhere else, Traefik will serve
# its default self-signed cert and retry ACME in the background until it does.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: synodl-tls
  namespace: synodl
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`${APP_HOST}`)
      kind: Rule
      services:
        - name: synodl
          port: 8080
  tls:
    certResolver: letsencrypt
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: synodl
  namespace: synodl
spec:
  entryPoints:
    - web
  routes:
    - match: Host(`${APP_HOST}`)
      kind: Rule
      services:
        - name: synodl
          port: 8080
