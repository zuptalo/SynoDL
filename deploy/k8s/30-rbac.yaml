# Permission for synodl to run short-lived YouTube download workers (spec 0012).
#
# This is the narrowest thing that works, and it is narrow on purpose: the
# constitution (v2.1.0, Principle III) treats this ServiceAccount token as a
# credential under the same custody rules as a NAS password. Before changing
# anything here, note what is deliberately ABSENT:
#
#   - It is a Role, NEVER a ClusterRole. synodl can act in its own namespace and
#     nowhere else in the cluster.
#   - No `secrets`. A compromised synodl must not be able to read the cluster's
#     secrets — including its own SECRETS_KEY.
#   - No `pods/exec` or `pods/attach`. Creating a workload is not the same
#     permission as getting a shell inside one — and neither is READING a
#     worker's output, below. That a worker's stdout is legible here is not an
#     argument that a shell inside it should be.
#   - No `create`/`delete` on pods directly. Pods arrive only as a consequence of
#     a Job, which is what makes "workers are ephemeral" enforceable.
#
# The `pods` read is what lets a Job's state be reported accurately; the Job
# object alone does not always say why something failed.
#
# `pods/log` (spec 0013) is what lets a download report real progress, and
# report whether a lyrics file was written and in which language. Those facts
# exist NOWHERE else: the Job object does not carry them, and the server never
# mounts the media library, so it cannot inspect the files a worker produced.
# It is a subresource with its own RBAC entry, so granting it grants reading
# output and precisely nothing more. Constitution v2.2.0 admits it as part of
# what orchestration needs and is explicit that it stays namespaced, stays
# scoped to workloads SynoDL created, and is never widened into exec or attach.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: synodl
  namespace: synodl
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: synodl-worker
  namespace: synodl
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: synodl-worker
  namespace: synodl
subjects:
  - kind: ServiceAccount
    name: synodl
    namespace: synodl
roleRef:
  kind: Role
  name: synodl-worker
  apiGroup: rbac.authorization.k8s.io
