# CI: verifies every PR into main (the only long-lived branch). The full
# build + test suite runs on PRs that touch code (path-filtered — doc/spec/
# tooling-only changes skip it); the always-on guards keep the roadmap honest
# and the version monotonic. Publishing is NOT done here: every push to main
# (i.e. every merge) goes through release.yml, which re-verifies and publishes.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch: # manual verification run of the current ref

# Superseded PR runs are cancelled — only the newest push to a PR matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Detect whether this change touches anything the heavy build/test/e2e jobs
  # actually validate. Doc/spec/tooling-only changes (markdown, specs/, .specify/,
  # ROADMAP.md, scripts/) skip the heavy suite — the always-on roadmap-guard below
  # is the real gate for those. Anything in app code, server, e2e, deps, configs,
  # the Dockerfile, or the workflows themselves runs the full suite.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # paths-filter needs history to diff
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # Empty token forces local git-based diffing instead of the GitHub REST
          # API's listFiles endpoint, which 404s on PRs with very large diffs —
          # git diff has no such limit and we have full history via fetch-depth: 0.
          token: ''
          # `code` is true when ANY path the heavy jobs cover changed. If nothing
          # here matched, the change is docs/specs/tooling-only and verify is skipped.
          filters: |
            code:
              - 'src/**'
              - 'server/**'
              - 'e2e/**'
              - 'public/**'
              - 'index.html'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'vite.config.*'
              - 'vitest.config.*'
              - 'playwright.config.*'
              - 'Dockerfile'
              - '.dockerignore'
              - '.github/workflows/**'

  # The full build + test suite — on PRs with code changes and manual dispatch.
  verify:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && needs.changes.outputs.code == 'true') }}
    uses: ./.github/workflows/build-test.yml

  # Keep the version monotonic and never reused. A bump is OPTIONAL (a merge
  # without one still publishes the rolling `latest`/`main-<sha>` images via
  # release.yml) — but when a PR DOES change the version it must move forward,
  # and it must not land on a version that has already been tagged/shipped.
  # This is what makes "this PR is also a release" safe to auto-merge.
  version-guard:
    name: Version guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # need main's history + tags to compare against
      - name: Version must move forward and never reuse a shipped tag
        run: |
          set -euo pipefail

          head_ver=$(node -p "require('./package.json').version")
          git fetch --quiet origin main
          # main won't have a package.json before the bootstrap push — treat
          # that as version 0.0.0 rather than letting `git show` fail the job.
          if git cat-file -e origin/main:package.json 2>/dev/null; then
            base_ver=$(git show origin/main:package.json | node -p "JSON.parse(require('fs').readFileSync(0)).version")
          else
            base_ver="0.0.0"
          fi
          echo "head (this PR) version: $head_ver"
          echo "base (main) version:    $base_ver"

          fail() { echo "::error::$1"; exit 1; }

          if [ "$head_ver" = "$base_ver" ]; then
            echo "✓ Version unchanged — this merge publishes rolling images only (no tagged release)."
            exit 0
          fi

          # Changed → must be strictly greater than main's (no downgrades).
          greater=$(printf '%s\n%s\n' "$base_ver" "$head_ver" | sort -V | tail -n1)
          if [ "$greater" != "$head_ver" ]; then
            fail "package.json version $head_ver is lower than main's $base_ver. Bump forward with 'npm run release:patch' (or :minor / :major)."
          fi

          # And its tag must not already exist (a version never ships twice).
          git fetch --quiet --tags origin
          if git rev-parse "refs/tags/v$head_ver" >/dev/null 2>&1; then
            fail "Tag v$head_ver already exists — version $head_ver has already shipped. Pick the next version with 'npm run release:patch' (or :minor / :major)."
          fi

          echo "✓ Version bumped $base_ver → $head_ver and v$head_ver is unreleased. Merging this PR cuts that release."

  # Keep ROADMAP.md honest: it is generated from specs/<NNNN-slug>/spec.md, so a
  # spec added or a Status bumped without regenerating would let the roadmap drift
  # from what's actually checked in. This fails the build until `make roadmap` is
  # run and the result committed. Cheap, and runs on every PR + dispatch.
  roadmap-guard:
    name: Roadmap up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify ROADMAP.md matches specs/
        run: python3 scripts/roadmap-gen.py --check

  # Single required status check for branch protection. Because `verify` is
  # conditionally skipped, its individual "verify / *" checks can't be required
  # directly — a skipped-but-required check blocks the PR forever. This gate runs
  # ALWAYS and passes when every upstream job either succeeded or was deliberately
  # skipped, failing only if one actually failed or was cancelled. Branch protection
  # requires THIS plus the always-on roadmap + version guards (see
  # scripts/setup-branch-protection.sh).
  ci-gate:
    name: CI gate
    if: always()
    needs: [changes, verify, roadmap-guard, version-guard]
    runs-on: ubuntu-latest
    steps:
      - name: Require every upstream job to have passed (or been skipped)
        run: |
          set -euo pipefail
          declare -A results=(
            [changes]='${{ needs.changes.result }}'
            [verify]='${{ needs.verify.result }}'
            [roadmap-guard]='${{ needs.roadmap-guard.result }}'
            [version-guard]='${{ needs.version-guard.result }}'
          )
          fail=0
          for job in "${!results[@]}"; do
            r="${results[$job]}"
            echo "$job: $r"
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then fail=1; fi
          done
          if [ "$fail" = "1" ]; then
            echo "::error::a required CI job did not pass"; exit 1
          fi
          echo "All required CI jobs passed or were intentionally skipped."
