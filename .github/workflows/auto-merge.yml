# Auto-merge every green PR: main is the only long-lived branch, and a PR whose
# required checks pass needs no babysitting.
#
# We do NOT use GitHub's native auto-merge or read the branch-protection API:
#  - `gh pr merge --auto` is unreliable here (it silently no-ops while GitHub is
#    still computing mergeability, and errors "clean status" once already green);
#  - the branch-protection REST API returns 403 on a private repo without GitHub
#    Pro, which made the old safety gate conclude "unprotected" and SKIP the merge
#    step entirely (the real reason nothing ever self-merged).
#
# Instead we poll `mergeable_state` from the pulls API (free, and it already
# encodes branch protection: "clean"/"unstable" mean every REQUIRED check has
# passed) and merge directly the moment the PR is mergeable. A direct squash merge
# also respects branch protection server-side, so a red PR can't slip through.
#
# Merge method is SQUASH: this repo allows squash merges only (merge commits are
# disabled). release.yml re-verifies whatever lands on main.
name: Auto-merge PRs

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    branches: [main] # base branch == main (all PRs)

permissions:
  contents: write # github-actions[bot] performs the merge
  pull-requests: write
  actions: write # dispatch release.yml after a self-merge (see below)

jobs:
  auto-merge:
    name: Auto-merge
    # Same-repo PRs only (a fork's token is read-only), never on drafts.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Merge once the required checks are green
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          # ~8-min ceiling (80 × 6 s), comfortably past the slowest check (e2e ~4
          # min); the loop exits the instant the PR merges.
          for i in $(seq 1 80); do
            if [ "$(gh api "repos/$REPO/pulls/$PR" --jq '.merged')" = "true" ]; then
              echo "PR #$PR already merged."
              exit 0
            fi
            # mergeable_state: clean = mergeable + all required checks passed;
            # unstable = mergeable, only a NON-required check (e.g. an informational
            # scan) is failing — still safe to merge. blocked/behind/unknown/dirty =
            # not ready (or conflicting) → wait.
            state=$(gh api "repos/$REPO/pulls/$PR" --jq '.mergeable_state')
            case "$state" in
              clean | unstable | has_hooks)
                if gh pr merge "$PR" --repo "$REPO" --squash; then
                  echo "merged=true" >> "$GITHUB_OUTPUT"
                  echo "Merged #$PR."
                  exit 0
                fi
                ;;
            esac
            sleep 6
          done
          echo "::warning::#$PR not mergeable after ~8 min — merge manually once green."

      - name: Dispatch the release after a self-merge
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A push made with the run's own GITHUB_TOKEN doesn't trigger other
          # workflows (anti-loop safeguard), so release.yml's `push: [main]` won't
          # fire after the merge above. workflow_dispatch is exempt — kick it off.
          # (Only on a SELF-merge: a human merge from a personal token already
          # triggers release.yml via push, so we must not double-dispatch.)
          echo "Dispatching release.yml on main after self-merge of #${{ github.event.pull_request.number }}"
          gh workflow run release.yml --repo "${{ github.repository }}" --ref main
