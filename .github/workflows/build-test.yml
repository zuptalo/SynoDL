# Reusable build + test pipeline, called by ci.yml (PRs) and
# release.yml (main pushes). Keeping it in one place means the exact same
# gates run on the PR and again on the merge commit that publishes.
name: build-test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  client:
    name: Client (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `npm run build` is `vue-tsc --noEmit && vite build`: typecheck then bundle.
      - run: npm run build
      - uses: actions/upload-artifact@v6
        with:
          name: web-dist
          path: dist
          retention-days: 7

  client-test:
    name: Client (unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Vitest unit tests for the pure modules + idb wrapper, with the coverage
      # floor enforced (vitest.config.ts thresholds). No browser needed (Node env).
      - run: npm run test:unit:coverage

  server:
    name: Server (build + vet + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: server/go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      # Coverage floor on the security-critical packages: config (env contract)
      # and syno (the DSM allowlist + error mapping). Ratchet these floors up as
      # coverage grows — they may rise, never regress (constitution Principle II).
      - name: Coverage floor (critical packages)
        run: |
          set -euo pipefail
          declare -A floors=( [config]=85 [syno]=75 )
          for pkg in "${!floors[@]}"; do
            go test "./internal/$pkg/" -covermode=set -coverprofile=/tmp/cover.out >/dev/null
            pct=$(go tool cover -func=/tmp/cover.out | awk '/^total:/ {print substr($3, 1, length($3)-1)}')
            floor=${floors[$pkg]}
            echo "internal/$pkg: ${pct}% (floor ${floor}%)"
            awk -v p="$pct" -v f="$floor" 'BEGIN { exit (p+0 >= f+0) ? 0 : 1 }' || {
              echo "::error::internal/$pkg coverage ${pct}% is below the ${floor}% floor"; exit 1; }
          done

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: server/go.mod
      - run: npm ci
      # global-setup.ts builds + launches the isolated test stacks itself — a
      # stateless pair (mock DSM + synodl) and a stateful one (TLS mock DSM +
      # a synodl built with the `sourcemock` tag, for the download-source specs).
      # No real NAS and no credentials anywhere; nothing else to start here.
      # Cache the downloaded browser binaries (~150 MB) keyed off the lockfile, which
      # pins the Playwright version, so we only re-download when it changes. The
      # install below still runs --with-deps (apt OS libs) quickly; on a cache hit it
      # finds the browsers present and skips the download.
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-
      - name: Install Playwright (chromium + system deps)
        run: npx playwright install --with-deps chromium
      - name: Run e2e
        run: npm run test:e2e
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
