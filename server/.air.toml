# air config for synodl - rebuilds + restarts the backend on every .go change.
# Builds to a temp binary (avoids the `go run` orphan-on-:8080 gotcha).
root = "."
tmp_dir = "tmp"

[build]
  # The `sourcemock` tag compiles in the dev-only ability to point a download
  # source at the in-repo fake site, so `make start` can exercise the catalog
  # with no real credentials. A release build never passes this tag, so that
  # ability does not exist in production at all.
  cmd = "go build -tags sourcemock -o ./tmp/synodl ./cmd/synodl"
  bin = "./tmp/synodl"
  include_ext = ["go"]
  exclude_dir = ["tmp"]
  exclude_regex = ["_test\\.go"]
  delay = 500
  stop_on_error = true
  kill_delay = "2s"
  send_interrupt = true

[misc]
  clean_on_exit = true
