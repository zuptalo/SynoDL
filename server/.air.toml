# air config for synodl - rebuilds + restarts the backend on every .go change.
# Builds to a temp binary (avoids the `go run` orphan-on-:8080 gotcha).
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/synodl ./cmd/synodl"
  bin = "./tmp/synodl"
  include_ext = ["go"]
  exclude_dir = ["tmp"]
  exclude_regex = ["_test\\.go"]
  delay = 500
  stop_on_error = true
  kill_delay = "2s"
  send_interrupt = true

[misc]
  clean_on_exit = true
